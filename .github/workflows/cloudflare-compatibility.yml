name: Cloudflare migration checks

on:
  push:
    branches: [cloudflare-supabase]
  pull_request:
    branches: [cloudflare-supabase]
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Validate Worker bundle and Wrangler configuration (dry run)
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc

  legacy-python-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python scripts/check_cloudflare_compat.py
